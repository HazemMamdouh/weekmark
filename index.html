function showFinalSummary(ws){const w=S.weeks[ws],f=w.final;const done=f.tasks.filter(t=>t.frac>=1),miss=f.tasks.filter(t=>t.frac!=null&&t.frac<1);
  openDlg(`<form method="dialog"><header class="dlg-h"><h2>${esc(wkLabel(ws))} finalized</h2><button type="button" class="icon" data-act="closedlg" aria-label="Close">×</button></header><div class="dlg-b">
  <div class="row" style="align-items:baseline;gap:16px"><span class="big">${fmtPct(f.score)}<small>%</small></span><span>${f.tier?`Reward earned: <b>${esc(f.tier.name)}</b>${f.tier.desc?`<br><span class="note">${esc(f.tier.desc)}</span>`:''}`:'No reward this week.'}</span></div>
  <div class="g2"><div><div class="eyebrow" style="margin-bottom:6px">Completed (${done.length})</div><div class="note" style="display:flex;flex-direction:column;gap:3px">${done.map(t=>`<span>✓ ${esc(t.name)}</span>`).join('')||'None'}</div></div>
  <div><div class="eyebrow" style="margin-bottom:6px">Missed targets (${miss.length})</div><div class="note" style="display:flex;flex-direction:column;gap:3px">${miss.map(t=>`<span>${esc(t.name)} · ${Math.round(t.frac*100)}%</span>`).join('')||'None'}</div></div></div>
  </div><footer class="dlg-f"><button type="button" class="btn primary" data-act="closedlg">Done</button></footer></form>`);}
function backupObj(){return {app:APP,version:VERSION,exportedAt:new Date().toISOString(),meta:S.meta,weeks:S.weeks};}
function validateBackup(o){const e=[];
  if(!o||typeof o!=='object')return ['The file is not a JSON object.'];
  if(o.app!==APP)e.push('This file was not exported from Weekmark.');
  if(typeof o.version!=='number'||o.version>VERSION)e.push(`Backup version ${o.version} is not supported by this app version.`);
  const m=o.meta;if(!m||!Array.isArray(m.defs)||!Array.isArray(m.templates)||!m.rewards||!Array.isArray(m.rewards.tiers))e.push('The settings section is missing or damaged.');
  else{m.defs.forEach(d=>{if(!d.id||!d.cfg||typeof d.cfg.name!=='string'||!TYPES[d.cfg.type]||!d.rec)e.push(`Recurring task “${(d.cfg&&d.cfg.name)||'?'}” is damaged.`);});}
  if(!o.weeks||typeof o.weeks!=='object'||Array.isArray(o.weeks))e.push('The weeks section is missing.');
  else for(const [k,w] of Object.entries(o.weeks)){if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!w||w.start!==k||!Array.isArray(w.instances)||typeof w.records!=='object'){e.push(`Week ${k} is damaged.`);}
    else if(w.instances.some(i=>!i.id||!i.cfg||typeof i.cfg.name!=='string'||!TYPES[i.cfg.type]))e.push(`A task in week ${k} is damaged.`);
    else if(new Set(w.instances.map(i=>i.id)).size!==w.instances.length)e.push(`Week ${k} has duplicate tasks.`);
    if(e.length>8)break;}
  return e;}
function checkImport(text){const box=$('#imp-res');S.ui.imp=null;let o;
  try{o=JSON.parse(text);}catch(err){box.innerHTML=`<div class="banner err"><p>This is not valid JSON: ${esc(err.message)}</p></div>`;return;}
  const e=validateBackup(o);if(e.length){box.innerHTML=`<div class="banner err"><p><b>Backup not accepted.</b> ${e.slice(0,6).map(esc).join(' ')}</p></div>`;return;}
  S.ui.imp=o;const nW=Object.keys(o.weeks).length,dup=Object.keys(o.weeks).filter(k=>S.weeks[k]).length;
  box.innerHTML=`<div class="banner"><p>Valid backup from ${esc((o.exportedAt||'').slice(0,10)||'unknown date')}: ${nW} weeks, ${o.meta.defs.length} recurring tasks, ${o.meta.templates.length} templates. ${dup?`${dup} of its weeks already exist here.`:''}</p>
  <div class="row"><button class="btn sm" data-act="impapply" data-mode="merge">Merge (keep my weeks)</button><button class="btn sm danger" data-act="impapply" data-mode="replace">Replace all</button></div></div>`;}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=A[b.dataset.act];if(a){e.preventDefault();a(b,e);}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset&&t.dataset.num){let v=t.value.trim();if(v!==''){const n=parseFloat(v);if(isNaN(n)||n<0){toast('Enter a number of 0 or more.',{err:true});render();return;}v=n;}setRecord(t.dataset.i,t.dataset.d,v===''?null:v);render();return;}
  if(t.dataset&&t.dataset.tier){const tr=S.ui.rdraft.tiers.find(x=>x.id===t.dataset.tier);tr[t.dataset.k]=t.dataset.k==='min'?t.value:t.value;render();return;}
  const c=t.dataset&&t.dataset.chg;if(!c)return;
  const w=curWeek();
  switch(c){
    case 'liveweekly':w.liveWeekly=t.checked;markWeek(w.start);render();break;
    case 'reflection':w.reflection=t.value;markWeek(w.start);toast('Notes saved');break;
    case 'claimed':w.claimed=t.checked;markWeek(w.start);toast(t.checked?'Marked as claimed':'Marked as not claimed');break;
    case 'claimrow':{const ww=S.weeks[t.dataset.ws];ww.claimed=t.checked;markWeek(ww.start);break;}
    case 'copysrc':S.ui.copySrc=t.value;render();break;
    case 'edvis':{if(t.name==='f-type'&&t.value==='occ'){const tg=$('#f-target');if(tg&&(!tg.value||tg.value==='1'))tg.value='3';}edVis();break;}
    case 'hyear':S.ui.histYear=t.value;render();break;
    case 'hmonth':S.ui.histMonth=t.value;render();break;
    case 'rmode':S.ui.rdraft.mode=t.value;render();break;
    case 'weekstart':S.meta.settings.weekStart=+t.value;markMeta();S.ws=weekStartOf(today());toast('Week start updated');render();break;
    case 'theme':S.meta.settings.theme=t.value;markMeta();applyTheme();break;
    case 'impfile':{const f=t.files&&t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#imp-text').value=r.result;checkImport(r.result);};r.onerror=()=>toast('Could not read that file.',{err:true});r.readAsText(f);break;}
  }});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.num){e.preventDefault();e.target.blur();}});
document.addEventListener('submit',e=>{const f=e.target;
  if(f.id==='pairform'){e.preventDefault();makePair();return;}
  if(f.id==='joinform'){e.preventDefault();joinFromPair();return;}
  if(f.id==='ed'){e.preventDefault();saveEditor();}
  else if(f.id==='tplform'){e.preventDefault();const name=$('#tpl-name').value.trim();if(!name){$('#e-tpl').textContent='Name the template.';return;}const ids=$$('input[name=tpl-task]:checked').map(x=>x.value);if(!ids.length){$('#e-tpl').textContent='Pick at least one task.';return;}
    const w=curWeek();S.meta.templates.push({id:uid(),name,tasks:w.instances.filter(i=>ids.includes(i.id)).map(i=>clone(i.cfg)),created:Date.now()});markMeta();closeDlg();toast(`Template “${name}” saved`);render();}
  else if(f.id==='applyform'){e.preventDefault();const id=$('#ap-tpl').value;closeDlg();A.tplapply({dataset:{id}});}
  else if(f.id==='stopform'){e.preventDefault();const d=defById($('#stop-id').value),cur=weekStartOf(today());const k=f.elements['stop-k'].value;let end,from;
    if(k==='after'){end=addDays(cur,6);from=addDays(cur,7);}else{const v=$('#stop-date').value;if(!v){$('#e-stop').textContent='Pick a date.';return;}from=weekStartOf(v);end=addDays(from,-1);if(from<=cur){$('#e-stop').textContent='Pick a week after this one.';return;}}
    if(end<d.rec.start){$('#e-stop').textContent='That is before the task started. Delete or archive it instead.';return;}
    d.rec={kind:'until',start:d.rec.start,end};markMeta();syncDef(d,from);closeDlg();toast(`“${d.cfg.name}” stops after ${fmtDY(end)}`);render();}
});
window.addEventListener('hashchange',route);
function route(){const h=(location.hash||'').slice(1);S.view=VIEWS.some(v=>v[0]===h)?h:'dashboard';if(S.view!=='rewards')S.ui.rdraft=null;render();const m=$('#main');if(m)window.scrollTo(0,0);}
let origTheme=null;
function applyTheme(){const t=S.meta?S.meta.settings.theme:'dark',el=document.documentElement;if(origTheme===null)origTheme=el.getAttribute('data-theme')||'';
  if(t==='system'){if(origTheme)el.setAttribute('data-theme',origTheme);else el.removeAttribute('data-theme');}else el.setAttribute('data-theme',t);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(el).getPropertyValue('--bg').trim()||'#0e1013';}

/* ---------- example data ---------- */
function rng(seed){return ()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function seedExample(){
  const R=rng(42),T=today(),cur=weekStartOf(T),start=addDays(cur,-21);
  const mk=(cfg,rec)=>{const d={id:uid(),cfg:Object.assign(defaultCfg(cfg.type),cfg),rec:Object.assign({start},rec),status:'active',created:Date.now()};S.meta.defs.push(d);return d;};
  const water=mk({name:'Drink water',type:'daily_num',op:'>=',target:3,unit:'L',scoring:'prop',category:'Health'},{kind:'forever'});
  const read=mk({name:'Read',type:'daily_num',op:'>=',target:30,unit:'minutes',scoring:'pass',category:'Learning',days:[0,1,2,3,4]},{kind:'forever'});
  const screen=mk({name:'Phone screen time',type:'daily_num',op:'<=',target:2,unit:'hours',scoring:'prop',category:'Personal'},{kind:'forever'});
  const bed=mk({name:'Make the bed',type:'check',category:'Personal'},{kind:'forever'});
  const ex=mk({name:'Exercise',type:'occ',op:'>=',target:3,scoring:'prop',weight:2,category:'Fitness'},{kind:'count',weeks:12});
  const study=mk({name:'Study AI',type:'week_num',op:'>=',target:5,unit:'hours',scoring:'prop',weight:2,category:'Learning'},{kind:'count',weeks:6});
  const fin=mk({name:'Review finances',type:'once',category:'Finance'},{kind:'forever'});
  S.meta.rewards={mode:'tiers',tiers:[{id:uid(),min:60,name:'Small reward',desc:'Favorite dessert',notes:''},{id:uid(),min:80,name:'Standard reward',desc:'Movie night out',notes:''},{id:uid(),min:95,name:'Premium reward',desc:'The book or game on your wish list',notes:''}]};
  for(let k=0;k<4;k++){const ws=addDays(start,7*k);const w=planWeek(ws,'recurring',{});
    const gi=d=>w.instances.find(i=>i.defId===d.id).id;const put=(d,day,v)=>{const id=gi(d);w.records[id]=w.records[id]||{};w.records[id][day]={v,t:Date.now()};};
    const exDays=new Set();while(exDays.size<(R()<.3?2:3))exDays.add(Math.floor(R()*7));
    const finDay=Math.floor(R()*7),finDone=R()<.75;
    weekDays(ws).forEach((d,i)=>{if(d>=T)return;const wd=dow(d);
      put(water,d,Math.round((2.1+R()*1.6)*10)/10);
      if(read.cfg.days.includes(wd))put(read,d,Math.round(15+R()*35));
      put(screen,d,Math.round((1.1+R()*2)*10)/10);
      if(R()<.8)put(bed,d,true);
      if(exDays.has(i))put(ex,d,1);
      if(R()<.7)put(study,d,Math.round((.5+R()*1.2)*2)/2);
      if(finDone&&i===finDay)put(fin,d,true);});
    if(k<3)finalizeWeek(ws);
    if(k===0)w.claimed=true;
  }
  S.weeks[addDays(start,14)].reflection='Good rhythm until Thursday; late nights pushed screen time up.';
  S.meta.settings.example=true;markMeta();
}

/* ---------- boot ---------- */
function gate(html){$('#root').innerHTML=`<div class="gate"><div class="panel">${html}</div></div>`;}
async function startApp(kv){
  if(S.started)return;S.started=true;S.kv=kv;
  let data={};try{data=await kv.all();}catch(e){S.saveErr='Could not load saved data: '+(e.message||e);}
  S.meta=normMeta(data.meta||null);
  Object.entries(data).forEach(([k,v])=>{if(k.startsWith('week_')&&v&&v.start)S.weeks[v.start]=normWeek(v);});
  await Sync.init(data._sync);
  applyTheme();
  const pair=(location.hash.match(/^#pair=([\w-]+)/)||[])[1];
  if(pair)history.replaceState(null,'',location.pathname+location.search);
  if(!data.meta&&!S.saveErr&&!pair&&!Sync.on()){seedExample();}
  S.ws=weekStartOf(today());
  shell();route();
  if(pair)askJoin(pair);
  if(Sync.on())Sync.run();
  setInterval(()=>{if(Sync.on()&&document.visibilityState==='visible'&&!Sync.busy)Sync.run();},60000);
  setInterval(()=>{if(Sync.on())paintSyncInfo();},30000);
  document.addEventListener('visibilitychange',()=>{if(!Sync.on())return;if(document.visibilityState==='visible')Sync.run();else if(S.dirty.size||Sync.st.pending.length){flush().then(()=>Sync.run());}});
  window.addEventListener('online',()=>{if(Sync.on())Sync.run();});
  window.addEventListener('beforeunload',e=>{if(S.dirty.size){flush();}});
}
function localHasRealData(){return !S.meta.settings.example&&(Object.keys(S.weeks).length>0||S.meta.defs.length>0||S.meta.templates.length>0);}
async function connectDevice(repo,token,pass){
  if(!window.crypto||!crypto.subtle)throw new Error('This page must be opened over https to use encrypted sync.');
  await flush();
  const r=await Sync.connect(repo,token,pass);
  let mode='upload';
  if(r.hasData){
    if(localHasRealData()){const ok=await ask({title:'Merge with your synced data?',body:'Your private repository already has Weekmark data from another device. It will be loaded here. Weeks that only exist on this device are added to it; where both have the same week or settings, the synced copy is kept. Export a backup first if unsure.',ok:'Connect and merge'});if(!ok)return false;mode='merge';}
    else mode='download';}
  await Sync.adopt(r,mode);
  if(Sync.err)toast(Sync.err,{err:true});else toast(mode==='upload'?'Sync is on. This device’s data is now in your private repository.':'Sync is on. Your synced data is loaded.');
  closeDlg();if(S.view!=='settings'&&mode!=='upload')location.hash='dashboard';S.ws=weekStartOf(today());render();return true;
}
async function makePair(){const err=$('#pr-err'),out=$('#pr-out'),btn=$('#pr-go'),pass=$('#pr-pass').value;err.textContent='';btn.disabled=true;
  try{if(!(await Sync.verify(pass))){err.textContent='That is not the passphrase this device uses.';return;}
    const link=await Sync.pairLink(pass);let qr='';
    try{if(!window.qrcode)await loadScript('qrcode.js');const q=qrcode(0,'L');q.addData(link);q.make();qr=q.createSvgTag({cellSize:4,margin:4,scalable:true});}catch(e){}
    out.innerHTML=`${qr?`<div style="background:#fff;border-radius:10px;padding:10px;max-width:260px;margin:4px auto">${qr}</div><p class="note" style="text-align:center">Scan with your phone’s camera, open the link, then type the same passphrase.</p>`:''}
      <label class="f">Or send yourself this link<input type="text" id="pr-link" readonly value="${esc(link)}"></label><div class="row"><button type="button" class="btn sm" data-act="copypair">Copy link</button></div>
      <p class="note">The link contains your access token, encrypted with your passphrase. Only share it with your own devices.</p>`;
  }catch(e){err.textContent=e.message||String(e);}finally{btn.disabled=false;}}
function askJoin(code){S.ui.pair=code;
  openDlg(`<form id="joinform" novalidate><header class="dlg-h"><h2>Connect this device</h2><button type="button" class="icon" data-act="closedlg" aria-label="Close">×</button></header><div class="dlg-b">
  <p>You opened a pairing link from your other device. Type your sync passphrase to start syncing here.</p>
  ${Sync.on()?'<p class="note">This device already syncs. Connecting replaces that connection.</p>':''}
  <label class="f">Passphrase<input type="password" id="jn-pass" autocomplete="current-password"></label><p class="err" id="jn-err"></p></div>
  <footer class="dlg-f"><button type="button" class="btn ghost" data-act="closedlg">Not now</button><button type="submit" class="btn primary" id="jn-go">Connect</button></footer></form>`);}
async function joinFromPair(){const err=$('#jn-err'),btn=$('#jn-go'),pass=$('#jn-pass').value;err.textContent='';btn.disabled=true;btn.textContent='Connecting…';
  try{const p=await Sync.readPair(S.ui.pair,pass);if(Sync.on())await Sync.disconnect();
    if(await connectDevice(p.o+'/'+p.r,p.t,pass))S.ui.pair=null;}
  catch(e){err.textContent=e.message||String(e);}finally{if(btn.isConnected){btn.disabled=false;btn.textContent='Connect';}}}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load '+src));document.head.appendChild(s);});}
async function boot(){
  origTheme=document.documentElement.getAttribute('data-theme')||'';
  document.documentElement.setAttribute('data-theme','dark');
  if(/^https?:$/.test(location.protocol)&&'serviceWorker' in navigator){try{const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}}
  await LocalKV.open();await startApp(LocalKV);
}
boot();
})();
</script>
